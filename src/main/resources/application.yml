server:
  port: 8080

spring:
  application:
    name: mini-thingsboard

  # ${NAME:default} -> use environment variable NAME if set, otherwise the default.
  # Defaults are for ./mvnw on your machine; docker-compose.yml sets the variables for containers.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/minitb}
    username: ${SPRING_DATASOURCE_USERNAME:minitb}
    password: ${SPRING_DATASOURCE_PASSWORD:minitb}

  jpa:
    hibernate:
      ddl-auto: validate      # check entities against the tables, never change them
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true                         # the default, written out so you can see it
    locations: classpath:db/migration     # the default folder for migration files

management:
  endpoints:
    web:
      exposure:
        include: health
